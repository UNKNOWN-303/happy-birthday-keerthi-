<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Keerthi! 🎉</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        handwriting: ['Caveat', 'cursive'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'rotate(0deg)' },
                            '20%': { transform: 'rotate(-5deg) scale(1.03)' },
                            '40%': { transform: 'rotate(5deg) scale(1.03)' },
                            '60%': { transform: 'rotate(-5deg) scale(1.03)' },
                            '80%': { transform: 'rotate(5deg) scale(1.03)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        lidOpen: {
                            '0%': { transform: 'translateY(0) rotate(0deg)' },
                            '100%': { transform: 'translateY(-140px) rotate(-20deg) scale(0.85)', opacity: '0' }
                        },
                        boxUnveil: {
                            '0%': { transform: 'scale(1)', opacity: '1' },
                            '100%': { transform: 'scale(0.8) translateY(60px)', opacity: '0' }
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.7) translateY(40px)' },
                            '70%': { transform: 'scale(1.04) translateY(-5px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }
                        },
                        glowPulse: {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
                            '50%': { opacity: '0.7', transform: 'scale(1.15)' }
                        }
                    },
                    animation: {
                        shake: 'shake 0.6s ease-in-out infinite',
                        float: 'float 3.2s ease-in-out infinite',
                        lidOpen: 'lidOpen 0.85s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        boxUnveil: 'boxUnveil 0.8s forwards ease-out',
                        popIn: 'popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                        glowPulse: 'glowPulse 3s ease-in-out infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #111827 0%, #31103f 40%, #500b38 70%, #1f0824 100%);
            min-h-screen: 100vh;
        }

        /* 3D Gift Container */
        .gift-container {
            perspective: 1000px;
        }

        .gift-box-wrapper {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .gift-box-wrapper:hover {
            transform: scale(1.04);
        }

        /* Background Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Glassmorphic Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(244, 63, 94, 0.25);
        }

        /* Box styling classes */
        .box-body {
            background: linear-gradient(145deg, #f43f5e, #be123c);
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }
        .box-lid {
            background: linear-gradient(145deg, #fb7185, #e11d48);
            box-shadow: 0 10px 20px rgba(0,0,0,0.25);
        }
        .ribbon-gold {
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #d97706);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-pink-500 selection:text-white">

    <!-- Background Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Mute / Unmute Floating Toggle -->
    <button id="soundToggle" onclick="toggleAudioMute()" class="fixed top-5 right-5 z-50 w-12 h-12 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center backdrop-blur-md border border-white/20 shadow-xl transition-all active:scale-95">
        <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
    </button>

    <!-- Ambient Glow behind box -->
    <div class="fixed w-96 h-96 rounded-full bg-rose-500/30 blur-3xl animate-glowPulse pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div class="relative z-10 max-w-lg w-full flex flex-col items-center justify-center min-h-[85vh]">

        <!-- Title & Header -->
        <div id="unboxingHeader" class="text-center space-y-3 mb-8 transition-all duration-500">
            <span class="inline-block px-4 py-1.5 rounded-full text-xs font-extrabold uppercase tracking-widest bg-white/10 text-pink-200 border border-white/20 backdrop-blur-md shadow-sm">
                A Surprise For You ✨
            </span>
            <h1 class="text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-200 via-rose-200 to-amber-200 drop-shadow-lg">
                Happy Birthday Keerthi! 🎂
            </h1>
            <p id="unboxingSubtitle" class="text-sm sm:text-base text-pink-100/80 font-medium animate-pulse flex items-center justify-center gap-2">
                <i class="fa-solid fa-hand-pointer text-amber-300"></i> Tap the gift box to open your messages!
            </p>
        </div>

        <!-- Interactive Gift Box Container -->
        <div id="unboxingBoxArea" class="gift-container cursor-pointer my-6">
            <div id="recipientBoxWrapper" class="gift-box-wrapper animate-float" onclick="openGiftBox()">
                
                <!-- Ribbon Bow Top -->
                <div id="recipientBow" class="w-28 h-14 mx-auto relative flex justify-center items-center">
                    <div class="w-12 h-12 rounded-full border-8 border-amber-400 absolute -left-3 transform -rotate-45 shadow-md"></div>
                    <div class="w-12 h-12 rounded-full border-8 border-amber-400 absolute -right-3 transform rotate-45 shadow-md"></div>
                    <div class="w-7 h-7 rounded-full bg-amber-300 z-10 shadow-lg border-2 border-amber-400"></div>
                </div>

                <!-- Box Lid -->
                <div id="recipientLid" class="w-64 h-16 box-lid rounded-t-xl relative mx-auto flex items-center justify-center border-b border-black/20 z-20 transition-all">
                    <div class="w-12 h-full ribbon-gold absolute"></div>
                </div>

                <!-- Box Body -->
                <div id="recipientBase" class="w-56 h-48 box-body rounded-b-xl relative mx-auto flex items-center justify-center z-10 transition-all">
                    <div class="w-12 h-full ribbon-gold absolute"></div>
                    <div class="h-12 w-full ribbon-gold absolute"></div>
                </div>

            </div>
        </div>

        <!-- Pop-up Cards Display Modal -->
        <div id="popupCardModal" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md hidden transition-all duration-300">
            
            <div id="popupCard" class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 relative border border-white/80 animate-popIn flex flex-col items-center text-center">
                
                <!-- Card Header Indicator -->
                <div class="w-full flex items-center justify-between text-xs font-bold text-slate-400 mb-6 border-b border-slate-200/80 pb-3">
                    <span id="cardStepIndicator" class="bg-gradient-to-r from-pink-500 to-rose-500 text-white px-3 py-1 rounded-full shadow-sm">
                        Card 1 of 5
                    </span>
                    <span class="text-pink-600 font-extrabold tracking-wide uppercase">For Keerthi 💕</span>
                </div>

                <!-- Message Body -->
                <div class="my-4 min-h-[140px] flex flex-col items-center justify-center px-2">
                    <!-- Icon graphic per card -->
                    <div id="cardIcon" class="w-16 h-16 bg-pink-100 text-pink-600 rounded-full flex items-center justify-center text-2xl mb-4 shadow-inner">
                        <i class="fa-solid fa-gift"></i>
                    </div>

                    <p id="cardText" class="text-slate-800 text-2xl sm:text-3xl font-bold font-handwriting leading-relaxed">
                        Card message here...
                    </p>
                </div>

                <!-- Next Card Button -->
                <div class="w-full mt-6 pt-2">
                    <button id="nextCardBtn" onclick="nextPopUpCard()" class="w-full py-4 px-6 bg-gradient-to-r from-pink-500 via-rose-500 to-amber-500 hover:from-pink-600 hover:to-amber-600 text-white font-extrabold rounded-2xl shadow-lg shadow-pink-500/30 transition-all transform active:scale-95 flex items-center justify-center gap-2 text-base tracking-wide">
                        <span>Next Message</span>
                        <i class="fa-solid fa-arrow-right text-sm"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Final Celebration Screen Modal -->
        <div id="finalCardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-lg hidden transition-all duration-500">
            <div class="glass-card max-w-md w-full rounded-3xl p-8 text-center space-y-6 border border-white/80 animate-popIn">
                <div class="w-20 h-20 bg-gradient-to-tr from-pink-500 to-amber-400 text-white rounded-full flex items-center justify-center mx-auto text-3xl shadow-xl shadow-pink-500/40 animate-bounce">
                    <i class="fa-solid fa-heart"></i>
                </div>

                <div class="space-y-2">
                    <h2 class="text-3xl font-extrabold text-slate-800">
                        Have a Magical Day! 💖
                    </h2>
                    <p class="text-sm text-slate-600 font-medium">
                        Sending lots of joy, smiles, and warm wishes your way today, Keerthi! ✨
                    </p>
                </div>

                <div class="pt-4 border-t border-slate-200/80">
                    <button onclick="replayUnboxing()" class="w-full py-4 px-6 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-extrabold rounded-2xl text-base transition-all shadow-lg shadow-pink-500/30 flex items-center justify-center gap-2 active:scale-95">
                        <i class="fa-solid fa-rotate-left"></i> Open Gift Again
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* ==================== CARD DATA ==================== */
        const messages = [
            { text: "Happy Birthday Keerthi! 🎂🎉", icon: "fa-cake-candles", color: "text-amber-500 bg-amber-100" },
            { text: "Miss you yar, it's been a long time 🥺❤️", icon: "fa-heart-crack", color: "text-rose-500 bg-rose-100" },
            { text: "Hope I see you soon! ✨🫂", icon: "fa-people-pulling", color: "text-purple-500 bg-purple-100" },
            { text: "And enjoy ur day! 🥳✨", icon: "fa-champagne-glasses", color: "text-pink-500 bg-pink-100" },
            { text: "Happy Birthday! 🎈💖", icon: "fa-gift", color: "text-rose-600 bg-rose-100" }
        ];

        let currentCardIndex = 0;
        let isMuted = false;
        let isOpened = false;

        /* Web Audio API Synthesizer (No external audio files required) */
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                initAudio();
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, now);
                    osc.frequency.exponentialRampToValueAtTime(750, now + 0.12);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } 
                else if (type === 'fanfare') {
                    // Birthday Arpeggio Chime
                    const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        gain.gain.setValueAtTime(0, now + idx * 0.1);
                        gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.1 + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.45);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.1);
                        osc.stop(now + idx * 0.1 + 0.45);
                    });
                }
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        function toggleAudioMute() {
            isMuted = !isMuted;
            const icon = document.getElementById('soundIcon');
            icon.className = isMuted ? "fa-solid fa-volume-xmark text-lg text-rose-300" : "fa-solid fa-volume-high text-lg text-white";
        }

        /* ==================== GIFT OPENING LOGIC ==================== */
        function openGiftBox() {
            if (isOpened) return;
            isOpened = true;

            const boxWrapper = document.getElementById('recipientBoxWrapper');
            const lid = document.getElementById('recipientLid');
            const bow = document.getElementById('recipientBow');

            // Trigger Shake -> Lid Lift animation
            boxWrapper.classList.remove('animate-float');
            boxWrapper.classList.add('animate-shake');

            playSound('pop');

            setTimeout(() => {
                boxWrapper.classList.remove('animate-shake');
                lid.classList.add('animate-lidOpen');
                bow.classList.add('opacity-0', 'transition-opacity');
                
                // Burst Confetti & Sound
                triggerConfettiExplosion();
                playSound('fanfare');

                // Reveal First Pop-up Card
                setTimeout(() => {
                    document.getElementById('unboxingBoxArea').classList.add('animate-boxUnveil');
                    showPopUpCard(0);
                }, 600);

            }, 700);
        }

        function showPopUpCard(index) {
            currentCardIndex = index;

            if (index >= messages.length) {
                // All cards completed -> Show final closing screen
                document.getElementById('popupCardModal').classList.add('hidden');
                document.getElementById('finalCardModal').classList.remove('hidden');
                triggerConfettiExplosion();
                playSound('fanfare');
                return;
            }

            const cardData = messages[index];
            document.getElementById('cardStepIndicator').textContent = `Card ${index + 1} of ${messages.length}`;
            document.getElementById('cardText').textContent = cardData.text;

            // Set Icon
            const iconWrapper = document.getElementById('cardIcon');
            iconWrapper.className = `w-16 h-16 rounded-full flex items-center justify-center text-2xl mb-4 shadow-inner ${cardData.color}`;
            iconWrapper.innerHTML = `<i class="fa-solid ${cardData.icon}"></i>`;

            // Button Text logic
            const nextBtn = document.getElementById('nextCardBtn');
            if (index === messages.length - 1) {
                nextBtn.innerHTML = `<span>Final Wish ❤️</span> <i class="fa-solid fa-heart text-sm"></i>`;
            } else {
                nextBtn.innerHTML = `<span>Next Message</span> <i class="fa-solid fa-arrow-right text-sm"></i>`;
            }

            // Display Modal
            const modal = document.getElementById('popupCardModal');
            modal.classList.remove('hidden');

            playSound('pop');
            triggerLightConfetti();
        }

        function nextPopUpCard() {
            showPopUpCard(currentCardIndex + 1);
        }

        function replayUnboxing() {
            currentCardIndex = 0;
            isOpened = false;

            document.getElementById('finalCardModal').classList.add('hidden');
            document.getElementById('popupCardModal').classList.add('hidden');

            const boxWrapper = document.getElementById('recipientBoxWrapper');
            const lid = document.getElementById('recipientLid');
            const bow = document.getElementById('recipientBow');
            const boxArea = document.getElementById('unboxingBoxArea');

            boxArea.classList.remove('animate-boxUnveil');
            lid.classList.remove('animate-lidOpen');
            bow.classList.remove('opacity-0');
            boxWrapper.classList.add('animate-float');

            playSound('pop');
        }


        /* ==================== PARTICLES & CONFETTI ==================== */
        let canvas, ctx;
        let particles = [];
        const particleColors = ['#f43f5e', '#fb7185', '#f59e0b', '#fbbf24', '#ffffff'];

        function initParticleCanvas() {
            canvas = document.getElementById('particleCanvas');
            ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // Create floating sparkles
            particles = [];
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    color: particleColors[Math.floor(Math.random() * particleColors.length)],
                    speedY: Math.random() * 0.6 + 0.2,
                    speedX: (Math.random() - 0.5) * 0.4,
                    alpha: Math.random() * 0.6 + 0.2
                });
            }

            animateParticles();
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }

        function triggerConfettiExplosion() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#f43f5e', '#fb7185', '#f59e0b', '#fbbf24', '#e11d48']
                });
            }
        }

        function triggerLightConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 25,
                    spread: 50,
                    origin: { y: 0.7 }
                });
            }
        }

        window.addEventListener('DOMContentLoaded', initParticleCanvas);
    </script>
</body>
</html>
